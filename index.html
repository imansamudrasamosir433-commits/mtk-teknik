<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulator Teknik Step-by-Step</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}

#cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}.chip{flex:none;background:#0f1a30;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;font:inherit;font-size:.82rem;transition:.2s}.chip.on,.chip:hover{color:#06202a;background:var(--c);border-color:var(--c);transform:translateY(-1px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;animation:up .4s both;backdrop-filter:blur(6px)}.card.shake{animation:shake .4s}

#form{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:12px 0}label{font-size:.75rem;color:var(--mut);display:block;margin-bottom:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}button.b{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,filter .2s}button.b:hover{filter:brightness(1.06)}button.b:active{transform:scale(.96)}.go{background:var(--g);color:#052e1f}.ex{background:var(--a);color:#3a2800}.rs{background:#1c2943;color:var(--tx)}

</style></head><body><main>
<h1>⚡ Kalkulator Teknik Step-by-Step</h1><p class="sub">Elektro · Mesin · Matematika Teknik · Industri · Pecahan Parsial Mentah — selalu dengan jalan pengerjaan.</p>
<div id="cats"></div>
<div class="card" id="box"><select id="sel"></select><div id="form"></div><div class="btns"><button class="b go" id="bGo">Hitung Jalan</button><button class="b ex" id="bEx">Contoh Soal</button><button class="b rs" id="bRs">Reset</button></div><div id="err"></div></div>
<div id="out"></div></main>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fmt=n=>{if(typeof n!=='number')return String(n);if(!isFinite(n))return String(n);if(Object.is(n,-0))n=0;const a=Math.abs(n);if(a!==0&&(a<1e-4||a>=1e8))return n.toExponential(4);return String(+n.toPrecision(7))};
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,need=(c,m)=>{if(!c)throw Error(m)},PI=Math.PI;
const pl=(c,x='x')=>{const n=c.length-1;const s=c.map((a,i)=>{const p=n-i;return Math.abs(a)>1e-9?(a<0?'-':'+')+(Math.abs(Math.abs(a)-1)<1e-8&&p?'':fmt(Math.abs(a)))+(p?x+(p>1?'^'+p:''):''):''}).join('');return s.replace(/^\+/,'').replace(/\+/g,' + ').replace(/-/g,' − ').trim()||'0'};
const pe=(c,x)=>c.reduce((s,a)=>s*x+a,0),pd=c=>c.slice(0,-1).map((a,i)=>a*(c.length-1-i)),pint=c=>c.map((a,i)=>a/(c.length-i)).concat(0);
function mk(e,vs){let s=e.replace(/(\d)\s*([a-zA-Z(])/g,'$1*$2').replace(/\)\s*([a-zA-Z\d(])/g,')*$1').replace(/\^/g,'**').replace(/\bln\b/g,'log').replace(/\bpi\b/gi,'PI');
const t=s.replace(/\b(sin|cos|tan|sqrt|exp|log|abs|PI|E)\b/g,'').replace(new RegExp('\\b('+vs.join('|')+')\\b','g'),'');
need(/^[\d\s+\-*\/().,]*$/.test(t),'Ekspresi mengandung karakter/fungsi yang tidak dikenal');
try{return new Function(...vs,'with(Math){return '+s+'}')}catch(x){throw Error('Sintaks ekspresi salah')}}
const list=s=>{const a=s.split(/[,;\s]+/).filter(Boolean).map(Number);need(a.length&&a.every(isFinite),'Daftar harus berupa angka dipisah koma');return a};
const sim=(K,wn,z,T)=>{const N=3000,dt=T/N;let y=0,v=0;const A=[0];for(let i=0;i<N;i++){v+=(K*wn*wn-2*z*wn*v-wn*wn*y)*dt;y+=v*dt;A.push(y)}return t=>A[Math.min(N,Math.round(t/dt))]};

/* ===== MESIN POLINOMIAL & PECAHAN PARSIAL MENTAH (A, B, C, D, E, ...) ===== */
// Representasi polinomial: indeks 0 = pangkat tertinggi (konsisten dengan pd, pint, pe)
const pTrim=p=>{const q=p.map(v=>Math.abs(v)<1e-10?0:v);while(q.length>1&&Math.abs(q[0])<1e-10)q.shift();return q.length?q:[0]};
const pAdd=(a,b)=>{const n=Math.max(a.length,b.length),aa=Array(n-a.length).fill(0).concat(a),bb=Array(n-b.length).fill(0).concat(b);return pTrim(aa.map((v,i)=>v+bb[i]))};
const pSub=(a,b)=>{const n=Math.max(a.length,b.length),aa=Array(n-a.length).fill(0).concat(a),bb=Array(n-b.length).fill(0).concat(b);return pTrim(aa.map((v,i)=>v-bb[i]))};
const pScale=(a,k)=>pTrim(a.map(v=>v*k));
const pMul=(a,b)=>{const out=Array(a.length+b.length-1).fill(0);for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)out[i+j]+=a[i]*b[j];return pTrim(out)};
const pPow=(a,e)=>{let r=[1];for(let i=0;i<e;i++)r=pMul(r,a);return r};
function pDiv(num,den){
  let rem=pTrim(num);const d=pTrim(den);
  need(!(d.length===1&&Math.abs(d[0])<1e-10),'Penyebut tidak boleh 0');
  if(rem.length<d.length)return{q:[0],r:rem};
  const q=Array(rem.length-d.length+1).fill(0),lead=d[0];
  for(let i=0;i<=rem.length-d.length;i++){
    const c=rem[i]/lead;q[i]=c;
    for(let j=0;j<d.length;j++)rem[i+j]-=c*d[j];
    rem=pTrim(rem);
  }
  return{q:pTrim(q),r:rem};
}
function parseLinearTerm(tok){
  let s=tok.trim().replace(/\s+/g,'');
  if(!s.includes('x')){const v=Number(s);need(isFinite(v)&&v!==0,`Faktor konstanta "${tok}" tidak valid`);return[v]}
  const m=s.match(/^([+-]?\d*\.?\d*)x(?:\^(\d+))?([+-]\d+\.?\d*)?$/);
  need(m,`Tidak bisa membaca suku/faktor "${tok}"`);
  let a=m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:Number(m[1]);
  need(isFinite(a),'Koefisien x tidak valid');
  const deg=m[2]?parseInt(m[2],10):1;
  const c0=m[3]?Number(m[3]):0;
  need(isFinite(c0),'Konstanta tidak valid');
  if(deg===1)return pTrim([a,c0]);
  const out=Array(deg+1).fill(0);out[0]=a;out[out.length-1]=c0;return pTrim(out);
}
function parsePolyRaw(raw){
  let s=raw.trim().replace(/−/g,'-').replace(/\s+/g,'');
  need(s.length>0,'Ekspresi polinomial kosong');
  // Jika bentuk perkalian/pangkat tanda kurung seperti (x+4)(2x-3)(3x+1) atau (2x-3)^2 atau (x+1)(x^2+5x-2)
  const grpRe=/^\(([^()]+)\)(?:\^(\d+))?/;
  if(s.startsWith('(')){
    let rest=s,prod=[1],matchedAny=false;
    while(rest.length>0){
      if(rest.startsWith('*'))rest=rest.slice(1);
      const m=rest.match(grpRe);
      if(!m){matchedAny=false;break}
      matchedAny=true;
      const inner=parsePolyRaw(m[1]),pw=m[2]?parseInt(m[2],10):1;
      need(pw>=1&&pw<=8,'Pangkat faktor harus 1–8');
      prod=pMul(prod,pPow(inner,pw));
      rest=rest.slice(m[0].length);
    }
    if(matchedAny&&rest.length===0)return pTrim(prod);
  }
  if(s.startsWith('(')&&s.endsWith(')'))s=s.slice(1,-1);
  s=s.replace(/(\d)(x)/gi,'$1*$2').replace(/(\d)\(/g,'$1*(').replace(/\)\(/g,')*(');
  const terms=s.replace(/-/g,'+-').split('+').filter(Boolean);
  let acc=[0];
  for(const t of terms){
    const clean=t.replace(/\*/g,'');
    if(!clean.includes('x')){
      const v=Number(clean);need(isFinite(v),`Angka tidak valid: "${t}"`);
      acc=pAdd(acc,[v]);
    }else{
      const idxX=clean.indexOf('x');
      const cStr=clean.slice(0,idxX);
      const pStr=clean.slice(idxX+1);
      const coeff=cStr===''||cStr==='+'?1:cStr==='-'?-1:Number(cStr);
      need(isFinite(coeff),`Koefisien tidak valid: "${t}"`);
      let deg=1;
      if(pStr){need(pStr.startsWith('^'),`Format pangkat salah: "${t}"`);deg=parseInt(pStr.slice(1),10);need(Number.isInteger(deg)&&deg>=0&&deg<=12,`Pangkat tidak valid: "${t}"`)}
      const arr=Array(deg+1).fill(0);arr[0]=coeff;
      acc=pAdd(acc,arr);
    }
  }
  return pTrim(acc);
}
const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b)[a,b]=[b,a%b];return a||1};
const divs=n=>{const k=Math.abs(Math.round(n))||1,out=new Set();for(let d=1;d*d<=k;d++)if(k%d===0){out.add(d);out.add(k/d)}return[...out]};
function factorDenRaw(denPoly){
  let rem=pTrim(denPoly);
  const linMap=new Map(); // key "a|b" -> {a,b,mult,poly:[a,b]}
  const addLin=(a,b)=>{
    const g=gcd(a,b);let na=a/g,nb=b/g;
    if(na<0){na=-na;nb=-nb}
    const key=`${na}|${nb}`;
    const prev=linMap.get(key)||{a:na,b:nb,mult:0,poly:pTrim([na,nb])};
    prev.mult++;linMap.set(key,prev);
  };
  let progress=true;
  while(rem.length-1>=1&&progress){
    progress=false;
    if(rem.length===2){addLin(rem[0],rem[1]);rem=[1];break}
    if(rem.every(v=>Math.abs(v-Math.round(v))<1e-6)){
      const ir=rem.map(Math.round);
      const cLast=ir[ir.length-1]||1,cLead=ir[0];
      const pList=divs(cLast),qList=divs(cLead);
      const cand=[];
      for(const p of pList)for(const q of qList){const g=gcd(p,q);cand.push([p/g,q/g],[-p/g,q/g])}
      for(const[rp,rq]of cand){
        const rVal=rp/rq;
        if(Math.abs(pe(rem,rVal))<1e-7){
          const fPoly=pTrim([rq,-rp]);
          const{q,r}=pDiv(rem,fPoly);
          if(r.every(v=>Math.abs(v)<1e-7)){addLin(rq,-rp);rem=q;progress=true;break}
        }
      }
    }
  }
  const remTrim=pTrim(rem);
  const quad=remTrim.length>=3?remTrim:null;
  return{linear:[...linMap.values()],quad,remConst:quad?1:remTrim[0]};
}
function solveLin(A,b){
  const n=b.length,M=A.map((row,i)=>[...row,b[i]]);
  for(let c=0;c<n;c++){
    let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[piv][c]))piv=r;
    [M[c],M[piv]]=[M[piv],M[c]];
    need(Math.abs(M[c][c])>1e-9,'Sistem persamaan koefisien tidak memiliki solusi tunggal');
    const pv=M[c][c];for(let j=c;j<=n;j++)M[c][j]/=pv;
    for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];for(let j=c;j<=n;j++)M[r][j]-=f*M[c][j]}
  }
  return M.map(row=>Math.abs(row[n])<1e-8?0:+row[n].toFixed(6));
}
function fmtFrac(n){
  if(Math.abs(n)<1e-8)return '0';
  if(Math.abs(n-Math.round(n))<1e-7)return String(Math.round(n));
  for(let d=2;d<=24;d++){const num=n*d;if(Math.abs(num-Math.round(num))<1e-6){const rn=Math.round(num),g=gcd(rn,d);return `${rn/g}/${d/g}`}}
  return fmt(n);
}
function runPartialRaw(s_num,s_den){
  const P0=parsePolyRaw(s_num),Q0=parsePolyRaw(s_den);
  need(!(Q0.length===1&&Math.abs(Q0[0])<1e-10),'Penyebut tidak boleh 0');
  const steps=[],g=[`Pembilang P(x) = ${pl(P0)} (derajat ${P0.length-1})`,`Penyebut Q(x) = ${pl(Q0)} (derajat ${Q0.length-1})`];
  let workP=P0,quot=[0];
  if(P0.length-1>=Q0.length-1){
    const dv=pDiv(P0,Q0);quot=dv.q;workP=dv.r;
    steps.push(`Pembagian polinomial (deg P ≥ deg Q): hasil bagi = ${pl(quot)}, sisa = ${pl(workP)}`);
    steps.push(`Bentuk awal: ${pl(quot)} + (${pl(workP)}) / (${pl(Q0)})`);
  }else{
    steps.push('Derajat pembilang < derajat penyebut → pecahan sejati, langsung dekomposisi.');
  }
  const fac=factorDenRaw(Q0);
  const fStrs=[];
  for(const lf of fac.linear){const bStr=`(${pl(lf.poly)})`;fStrs.push(lf.mult>1?`${bStr}^${lf.mult}`:bStr)}
  if(fac.quad)fStrs.push(`(${pl(fac.quad)})`);
  need(fStrs.length>0,'Penyebut tidak dapat difaktorkan menjadi faktor linear/kuadrat');
  steps.push(`Faktorisasi penyebut: Q(x) = ${fStrs.join(' · ')}`);

  // Susun suku pecahan parsial dengan koefisien A, B, C, D, E, ...
  const SYM='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let si=0;const nextS=()=>SYM[si++]||`K${si}`;
  const terms=[];
  for(const lf of fac.linear){
    for(let k=1;k<=lf.mult;k++){
      const sym=nextS(),subDen=pPow(lf.poly,k);
      terms.push({kind:'lin',sym,denPoly:subDen,tmpl:`${sym}/(${pl(subDen)})`});
    }
  }
  if(fac.quad){
    const s1=nextS(),s2=nextS();
    terms.push({kind:'quad',s1,s2,denPoly:fac.quad,tmpl:`(${s1}x + ${s2})/(${pl(fac.quad)})`});
  }
  const allSyms=[];terms.forEach(t=>t.kind==='lin'?allSyms.push(t.sym):allSyms.push(t.s1,t.s2));
  steps.push(`Bentuk dekomposisi (koefisien ${allSyms.join(', ')}): ${terms.map(t=>t.tmpl).join(' + ')}`);

  // Kalikan kedua ruas dengan Q0 agar pembilang setara
  const prodItems=[];
  for(const t of terms){
    const{q:multP}=pDiv(Q0,t.denPoly);
    if(t.kind==='lin')prodItems.push({sym:t.sym,poly:multP});
    else{prodItems.push({sym:t.s1,poly:pMul([1,0],multP)});prodItems.push({sym:t.s2,poly:multP})}
  }
  const maxD=Math.max(workP.length-1,Q0.length-1);
  // Bentuk polinomial ruas kanan dalam bentuk [pangkat tertinggi ... konstanta]
  const rhsPoly=[];
  for(let idx=0;idx<=maxD;idx++){
    const revIdx=maxD-idx;
    const row=Array(allSyms.length).fill(0);
    for(const it of prodItems){
      const pIdx=it.poly.length-1-revIdx;
      if(pIdx>=0)row[allSyms.indexOf(it.sym)]+=it.poly[pIdx];
    }
    const targetIdx=workP.length-1-revIdx;
    const targetVal=targetIdx>=0?workP[targetIdx]:0;
    rhsPoly.push({pow:revIdx,row,target:targetVal});
  }
  // Coba substitusi nilai x strategis untuk faktor linear non-berulang agar langkah lebih informatif
  for(const lf of fac.linear){
    if(Math.abs(lf.a)>1e-9){
      const xSub=-lf.b/lf.a;
      const lhsVal=pe(workP,xSub);
      const rhsVal=pe(Q0,xSub);
      steps.push(`Uji x = ${fmtFrac(xSub)} (pembuat nol ${pl(lf.poly)}): P(${fmtFrac(xSub)}) = ${fmtFrac(lhsVal)}`);
    }
  }
  // Bangun sistem persamaan linier dari kesamaan koefisien x^k
  const eqRows=[],eqTargets=[],eqDesc=[];
  for(const item of rhsPoly){
    const parts=[];
    item.row.forEach((c,j)=>{if(Math.abs(c)>1e-9)parts.push(`${fmtFrac(c)}${allSyms[j]}`)});
    if(parts.length||Math.abs(item.target)>1e-9){
      eqDesc.push(`x^${item.pow}: ${parts.join(' + ')||'0'} = ${fmtFrac(item.target)}`);
    }
    if(parts.some(Boolean)){eqRows.push(item.row);eqTargets.push(item.target)}
  }
  steps.push('Samakan koefisien pangkat x: '+eqDesc.join(' ; '));
  // Pilih baris independen hingga jumlah koefisien
  const selA=[],selB=[];
  for(let i=0;i<eqRows.length&&selA.length<allSyms.length;i++){
    const candA=[...selA,eqRows[i]],candB=[...selB,eqTargets[i]];
    // Cek determinan / rank dengan mencoba solveLin pada subset
    if(candA.length===allSyms.length){
      try{solveLin(candA,candB);selA.push(eqRows[i]);selB.push(eqTargets[i])}catch(_){}
    }else{selA.push(eqRows[i]);selB.push(eqTargets[i])}
  }
  need(selA.length===allSyms.length,'Tidak cukup persamaan independen untuk menentukan seluruh koefisien');
  const sol=solveLin(selA,selB);
  const valMap={};allSyms.forEach((s,i)=>valMap[s]=sol[i]);
  steps.push('Penyelesaian koefisien: '+allSyms.map(s=>`${s} = ${fmtFrac(valMap[s])}`).join(', '));

  const finalParts=[];
  if(quot.some(v=>Math.abs(v)>1e-9))finalParts.push(pl(quot));
  for(const t of terms){
    if(t.kind==='lin'){
      const v=valMap[t.sym];
      if(Math.abs(v)>1e-9)finalParts.push(`(${fmtFrac(v)}) / (${pl(t.denPoly)})`);
    }else{
      const v1=valMap[t.s1],v2=valMap[t.s2];
      if(Math.abs(v1)>1e-9||Math.abs(v2)>1e-9){
        const linNum=pTrim([v1,v2]);
        finalParts.push(`(${pl(linNum)}) / (${pl(t.denPoly)})`);
      }
    }
  }
  const ansExpr=finalParts.join(' + ').replace(/\+ \(\-/g,'− (')||'0';
  steps.push(`Bentuk pecahan parsial akhir: ${ansExpr}`);

  return{
    g:[`P(x) = ${pl(P0)}`,`Q(x) = ${pl(Q0)}`],
    f:['P(x)/Q(x) = H(x) + Σ[A_k/(ax+b)^k] + Σ[(Cx+D)/(px²+qx+r)]','Samakan pembilang & selesaikan koefisien A, B, C, D, E, ...'],
    s:steps,
    r:allSyms.map(s=>[s,fmtFrac(valMap[s]),'']),
    note:`Hasil: ${ansExpr}`,

add(A7,'Statistik & Kapabilitas Proses (Cp, Cpk)','s_d=Data (pisah koma)|lsl=LSL|usl=USL',[['10.1,10.3,9.9,10.0,10.2,10.4,9.8',9.5,10.5]],({s_d,lsl,usl})=>{const d=list(s_d),n=d.length;need(n>=2&&usl>lsl,'Min. 2 data dan USL > LSL');const m=d.reduce((p,q)=>p+q,0)/n,ss=d.reduce((p,q)=>p+(q-m)**2,0),va=ss/(n-1),sd=Math.sqrt(va);need(sd>0,'Standar deviasi = 0 (semua data sama)');const cp=(usl-lsl)/(6*sd),cpk=Math.min((usl-m)/(3*sd),(m-lsl)/(3*sd));

const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),COL=['#22d3ee','#fbbf24','#34d399','#a78bfa'];
function viz(v){if(!v)return'';const W=460,H=220,p=28;let b='';
if(v.fns){const N=240,xs=[...Array(N+1)].map((_,i)=>v.x0+(v.x1-v.x0)*i/N),ys=v.fns.map(f=>xs.map(x=>{const y=f(x);return isFinite(y)?y:0})),all=ys.flat();let lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){lo-=1;hi+=1}const X=x=>p+(x-v.x0)/(v.x1-v.x0)*(W-2*p),Y=y=>H-p-(y-lo)/(hi-lo)*(H-2*p);
b=`<path class="ax" d="M${p} ${Y(cl(0,lo,hi))}H${W-p}M${X(cl(0,v.x0,v.x1))} ${p}V${H-p}"/>`+ys.map((y,i)=>`<path class="pl" pathLength="1" stroke="${COL[i%4]}" d="${y.map((q,j)=>(j?'L':'M')+X(xs[j]).toFixed(1)+' '+Y(q).toFixed(1)).join('')}"/>`).join('')+`<text x="2" y="${p}">${fmt(hi)}</text><text x="2" y="${H-p}">${fmt(lo)}</text><text x="${p}" y="${H-6}">${fmt(v.x0)}</text><text x="${W-p-30}" y="${H-6}">${fmt(v.x1)}</text>`}
else if(v.vec){const m=Math.max(...v.vec.map(a=>Math.hypot(a[0],a[1])),1e-9),s=(Math.min(W,H)/2-p)/m,cx=W/2,cy=H/2;b=`<path class="ax" d="M${p} ${cy}H${W-p}M${cx} ${p/2}V${H-p/2}"/>`+v.vec.map((a,i)=>{const x=cx+a[0]*s,y=cy-a[1]*s;return`<path class="pl" pathLength="1" stroke="${COL[i%4]}" d="M${cx} ${cy}L${x.toFixed(1)} ${y.toFixed(1)}"/><circle cx="${x}" cy="${y}" r="4" fill="${COL[i%4]}"/><text x="${x+6}" y="${y-6}">${a[2]} (${fmt(a[0])}, ${fmt(a[1])})</text>`}).join('')}
else if(v.gauge!==undefined){const q=r=>p+cl(Math.log10(Math.max(r,1))/6,0,1)*(W-2*p),x=q(v.gauge);b=`<rect x="${q(1)}" y="90" width="${q(2300)-q(1)}" height="26" fill="#34d399"/><rect x="${q(2300)}" y="90" width="${q(4000)-q(2300)}" height="26" fill="#fbbf24"/><rect x="${q(4000)}" y="90" width="${q(1e6)-q(4000)}" height="26" fill="#f87171"/><path d="M${x} 86l-7-14h14z" fill="#e2e8f0"/><text x="${p}" y="136">1</text><text x="${q(2300)-14}" y="136">2300</text><text x="${q(4000)}" y="136">4000</text><text x="${W-p-22}" y="136">10⁶</text><text x="${p}" y="60">Skala log Re — Laminar | Transisi | Turbulen</text>`}
else if(v.pf){const items=v.pf.terms;const span=(W-40)/Math.max(items.length,1);
b=`<text x="20" y="34">Dekomposisi Pecahan Parsial: (${v.pf.num}) / (${v.pf.den})</text><line x1="20" y1="50" x2="${W-20}" y2="50" class="ax"/>`+items.map((t,i)=>{const cx=20+span*(i+.5);return`<path class="pl" pathLength="1" stroke="${COL[i%4]}" d="M${W/2} 50 L${cx.toFixed(1)} 105"/><rect x="${(cx-span*.42).toFixed(1)}" y="105" width="${(span*.84).toFixed(1)}" height="42" rx="8" fill="#101e38" stroke="${COL[i%4]}"/><text x="${cx.toFixed(1)}" y="130" text-anchor="middle" fill="#e2e8f0">${t}</text>`}).join('')}
return`<svg viewBox="0 0 ${W} ${H}">${b}</svg>`}

/* ===== UI ===== */
const cats=[...new Set(R.map(i=>i.k))];let ck=cats[0],cur,exi=0,vi=[];
const drawCats=()=>{$('#cats').innerHTML=cats.map(c=>`<button class="chip${c==ck?' on':''}" data-c="${c}">${c}</button>`).join('')};
function pickCat(c){ck=c;drawCats();vi=R.map((x,i)=>i).filter(i=>R[i].k==c);$('#sel').innerHTML=vi.map(i=>`<option value="${i}">${R[i].n}</option>`).join('');pickItem(vi[0])}
function pickItem(i){cur=R[i];exi=0;$('#form').innerHTML=cur.l.map(([k,l,op])=>`<div><label for="f_${k}">${l}</label>${op?`<select id="f_${k}">${op.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${k}" inputmode="${k.startsWith('s_')?'text':'decimal'}" autocomplete="off">`}</div>`).join('');fill(cur.ex[0]);$('#out').innerHTML='';$('#err').textContent=''}
function fill(a){cur.l.forEach(([k],j)=>$('#f_'+k).value=a[j])}
function vals(){const v={};for(const[k,l]of cur.l){const raw=$('#f_'+k).value.trim();if(raw==='')throw Error(`Input "${l}" masih kosong`);if(k.startsWith('s_')||k.startsWith('o_'))v[k]=raw;else{const n=Number(raw.replace(',','.'));if(!isFinite(n))throw Error(`Input "${l}" bukan angka yang valid`);v[k]=n}}return v}
function show(res){let n=0;const sec=(t,a,i)=>`<section class="st" style="animation-delay:${i*.2}s"><h3>${t}</h3>${a.map(x=>`<div class="ln" style="animation-delay:${i*.2+(++n)*.06}s">${x}</div>`).join('')}</section>`;
const rc=res.r.map(([l,v,u])=>`<div class="rc"><small>${l}</small><b ${typeof v=='number'?`data-v="${v}"`:''}>${typeof v=='number'?0:v}</b><span>${u}</span></div>`).join('');
$('#out').innerHTML=`<div class="card">${sec('① Diketahui & Konversi Satuan',res.g,0)}${sec('② Rumus / Metode',res.f,1)}${sec('③ Substitusi & Penjabaran Bertahap',res.s,2)}<section class="st" style="animation-delay:${.6+n*.06}s;border-color:#34d399"><h3>④ Hasil Akhir & Catatan Teknis</h3><div class="res">${rc}</div>${res.note?`<p class="note">${res.note}</p>`:''}${viz(res.viz)}</section></div>`;
const d=RM?0:(.6+n*.06)*1000;document.querySelectorAll('[data-v]').forEach(el=>{const v=+el.dataset.v;setTimeout(()=>{const t0=performance.now(),D=RM?0:900;(function f(t){const q=D?Math.min(1,(t-t0)/D):1;el.textContent=fmt(q<1?v*(1-Math.pow(1-q,3)):v);if(q<1)requestAnimationFrame(f)})(t0)},d)});$('#out').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}
function run(){$('#err').textContent='';try{show(cur.run(vals()))}catch(e){$('#err').textContent='⚠ '+e.message;const b=$('#box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#out').innerHTML=''}}
$('#cats').onclick=e=>{const c=e.target.dataset.c;if(c)pickCat(c)};$('#sel').onchange=e=>pickItem(+e.target.value);$('#bGo').onclick=run;
$('#bEx').onclick=()=>{let j;do{j=Math.floor(Math.random()*cur.ex.length)}while(cur.ex.length>1&&j==exi);exi=j;fill(cur.ex[j]);run()};
$('#bRs').onclick=()=>{cur.l.forEach(([k,,op])=>{const e=$('#f_'+k);e.value=op?op[0]:''});$('#out').innerHTML='';$('#err').textContent=''};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')run()});
pickCat(cats[0]);
</script></body></html>
